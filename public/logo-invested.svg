<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 160" role="img" aria-label="InvestED">
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="28%" stop-color="#e9edf3"/>
      <stop offset="55%" stop-color="#b9c1cf"/>
      <stop offset="78%" stop-color="#8d97a8"/>
      <stop offset="100%" stop-color="#c9d1dd"/>
    </linearGradient>
    <linearGradient id="metalArrow" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#aab3c2"/>
      <stop offset="55%" stop-color="#e6eaf1"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#2a3242" flood-opacity="0.38"/>
    </filter>
  </defs>
  <g filter="url(#softShadow)">
    <!-- Bar-chart E: vertical spine + ascending horizontal bars -->
    <g stroke="#4c5666" stroke-width="2.5">
      <rect x="24" y="42" width="18" height="98" rx="3" fill="url(#metal)"/>
      <rect x="24" y="42" width="66" height="15" rx="3" fill="url(#metal)"/>
      <rect x="24" y="86" width="94" height="15" rx="3" fill="url(#metal)"/>
      <rect x="24" y="125" width="122" height="15" rx="3" fill="url(#metal)"/>
    </g>
    <!-- Rising arrow -->
    <polyline points="52,116 96,72 122,86 176,18" fill="none" stroke="#4c5666" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="52,116 96,72 122,86 176,18" fill="none" stroke="url(#metalArrow)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="176,6 199,34 163,44" fill="url(#metalArrow)" stroke="#4c5666" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Wordmark -->
    <text x="212" y="118" font-family="'Arial Black', Arial, Helvetica, sans-serif" font-weight="900" font-size="64" letter-spacing="1" fill="url(#metal)" stroke="#4c5666" stroke-width="1.4">InvestED</text>
  </g>
</svg>
